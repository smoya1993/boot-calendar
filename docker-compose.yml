services:
  boot-calendar:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://84.247.170.83:5678/webhook/add-recipe}
    image: boot-calendar:latest
    container_name: boot-calendar
    environment:
      - PORT=${PORT:-4000}
      - NODE_ENV=${NODE_ENV:-production}
      - N8N_TIMEOUT_MS=${N8N_TIMEOUT_MS:-4000}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
    ports:
      - "${PORT:-4000}:4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/vote/health', r=>process.exit(r.statusCode===200?0:1)).on('error', ()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3


